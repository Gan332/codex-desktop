[package]
name = "codex-desktop"
version = "0.1.0"
edition = "2021"
description = "Codex CLI 桌面应用 - 高性能 Web 终端"
authors = ["codex-desktop"]

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
dirs = "5"
notify = "6"
uuid = { version = "1", features = ["v4"] }
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
